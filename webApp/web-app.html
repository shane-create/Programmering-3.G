<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="webApp.styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="menu-background">
      <div id="menu">
        <div class="menuItem" id="menu-1">
          <img
            class="menuIcon"
            alt="makeup icon"
            src="assets/icons/makeup-icon.png"
          />
        </div>
        <div class="menuItem" id="menu-2">
          <img
            src="assets/icons/comb-icon.png"
            alt="hair comb icon"
            class="menuIcon"
          />
        </div>
        <div class="menuItem" id="menu-3">
          <img
            src="assets/icons/shirt-icon.png"
            alt="shirt icon"
            class="menuIcon"
          />
        </div>
        <div class="menuItem" id="menu-4">
          <img
            src="assets/icons/skirt-icon.png"
            alt="skirt icon"
            class="menuIcon"
          />
        </div>
        <div class="menuItem" id="menu-5">
          <img
            src="assets/icons/heel-icon.png"
            alt="heel icon"
            class="menuIcon"
          />
        </div>
      </div>
    </div>

    <div class="base">
      <img src="assets/body/base.png" alt="doll body base" id="body" />
      <img src="assets/brows/brow5.png" id="browSlot" class="hiddenSlot" />
      <img src="assets/eyes/eye2.png" id="eyeSlot" class="hiddenSlot" />
    </div>

    <div class="page" id="page1">
      <closet-element
        inner-count="4"
        images='[
        ["assets/brows/brow1.png", 
        "assets/brows/brow2.png", 
        "assets/brows/brow3.png", 
        "assets/brows/brow4.png", 
        "assets/brows/brow5.png"],
        ["assets/eyes/eye1.png", 
        "assets/eyes/eye2.png", 
        "assets/eyes/eye3.png", 
        "assets/eyes/eye4.png",
        "assets/eyes/eye5.png"], 
        ["assets/noses/nose1.png",
        "assets/noses/nose2.png",
        "assets/noses/nose3.png",
        "assets/noses/nose4.png",
        "assets/noses/nose5.png"], 
        ["assets/mouths/mouth1.png",
        "assets/mouths/mouth2.png",
        "assets/mouths/mouth3.png",
        "assets/mouths/mouth4.png",
        "assets/mouths/mouth5.png"]]'
      ></closet-element>
    </div>

    <div class="page" id="page2"></div>
    <div class="page" id="page3"></div>
    <div class="page" id="page4"></div>
    <div class="page" id="page5"></div>

    <div class="footer">
      <div class="floor board"></div>
      <div class="floor boardTop"></div>
    </div>
    <script src="objects.js"></script>
  </body>
</html>
